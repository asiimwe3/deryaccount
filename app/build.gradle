plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.derycode.deryaccount'
    compileSdk 34

    defaultConfig {
        applicationId "com.derycode.deryaccount"
        minSdk 24          // covers most entry-level tablets in Uganda
        targetSdk 34
        versionCode 30
        versionName "0.11.2"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            // Filled by CI (android-release.yml) from repo secrets.
            // Local builds without these env vars fall back to default (debug) signing.
            if (System.getenv("ANDROID_KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Same pinned key as release builds: every CI build shares one
            // signature, so updates install OVER old versions — no uninstall,
            // no data loss. Local builds without the env vars are unaffected.
            if (System.getenv("ANDROID_KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion = '1.5.8' }
    packaging { resources.excludes += '/META-INF/{AL2.0,LGPL2.1}' }
}

dependencies {
    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.01.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    // Binary-compat fix: material3 1.1.2 calls KeyframesSpecConfig.at(T,int)
    // (erased: returns KeyframeEntity). animation-core 1.6.0 moved that method
    // to the base class with a different erased return type -> NoSuchMethodError
    // on SalesScreen's CircularProgressIndicator. 1.6.7 restores the exact
    // override (with bridge). Pin the whole animation artifact family to 1.6.7.
    implementation 'androidx.compose.animation:animation:1.6.7'
    implementation 'androidx.compose.animation:animation-core:1.6.7'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    // Camera barcode scanning (ML Kit) — for the phone camera scanner
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    implementation 'androidx.navigation:navigation-compose:2.7.6'

    // Room — offline-first local database
    def room = '2.6.1'
    implementation "androidx.room:room-runtime:$room"
    implementation "androidx.room:room-ktx:$room"
    ksp "androidx.room:room-compiler:$room"

    // Networking — Supabase REST sync
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // DataStore — settings/session
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // CameraX — barcode scanning
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // Bluetooth ESC/POS printing
    implementation 'com.github.DantSu:ESCPOS-ThermalPrinter-Android:3.0.0' // jitpack below

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
