name: Desktop installer (Windows)

# Builds the DeryAccount desktop MSI and EXE on a real Windows runner and
# publishes both as release assets. Tag with: desktop-v1.0.0
# The installer is what shops download and double-click.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: WiX Toolset (needed by jpackage for MSI)
        shell: pwsh
        run: |
          # windows-latest usually ships WiX 3 already; only install when it is missing.
          $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset -y --no-progress
            $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory |
                   Sort-Object Name -Descending | Select-Object -First 1
          }
          if (-not $wix) { throw "WiX Toolset not found" }
          Write-Host "Using $($wix.FullName)"
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Test the money flow
        working-directory: desktop
        run: gradle test --console=plain

      - name: Build MSI and EXE
        working-directory: desktop
        run: gradle packageMsi packageExe --console=plain

      # A trimmed runtime image without java.sql kills the app at startup with
      # "java/sql/DriverManager", so fail the build instead of shipping it.
      # A trimmed runtime image without java.sql kills the app at startup with
      # "java/sql/DriverManager", so check every packaged image before shipping.
      - name: Verify the bundled JDK modules
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Path desktop/build -Filter release -ErrorAction SilentlyContinue |
            Where-Object { (Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue) -match "MODULES=" }
          if (-not $files) {
            Write-Host "::warning::No packaged runtime image found to inspect; skipping the module check."
            exit 0
          }
          foreach ($f in $files) {
            Write-Host "Inspecting $($f.FullName)"
            $modules = (Get-Content $f.FullName | Select-String "MODULES=").Line
            foreach ($needed in @("java.sql", "java.naming", "jdk.unsupported")) {
              if ($modules -notmatch [regex]::Escape($needed)) {
                throw "Packaged runtime $($f.FullName) is missing $needed - the app would not start."
              }
            }
            Write-Host "Runtime modules OK: java.sql present."
          }

      - name: Collect installers
        run: |
          Get-ChildItem -Recurse desktop\build\compose\binaries\main | Select-Object FullName, Length

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: DeryAccount Desktop ${{ github.ref_name }}
          body: |
            DeryAccount for Windows — offline books of account, stock, POS and a full
            hotel front desk.

            Download the `.msi` (or the portable `.exe`), double-click, then sign in with
            owner / 1234 and change the PIN in Settings.

            Everything runs on the computer: no internet needed. Back up daily from
            Data & backup (the whole business is one file).
          files: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.wxs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
