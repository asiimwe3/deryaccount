name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already carries the Android SDK; accept licences and skip the
      # deprecated android-actions/setup-android action (it now fails on the runner).
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          ls "$SDK_ROOT" | head

      - name: Decode pinned signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/pinned.keystore"
            echo "PINNED_KEYSTORE=$GITHUB_WORKSPACE/pinned.keystore" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE secret — building with default debug signing."
          fi

      # A release build is minified and signed with the pinned key: ~4x smaller and
      # far lighter at startup than the old debug APKs that phones were killing.
      # An adaptive icon (mipmap-anydpi-v26/ic_launcher.xml) cannot be loaded as a
      # normal drawable: doing so kills the app on API 26+ with
      # "Only VectorDrawables and rasterized asset types are supported".
      - name: Guard against adaptive icons in the UI
        run: |
          if grep -rn "R\.mipmap\." app/src/main/java; then
            echo "Use R.drawable.ic_logo (a raster) in the UI, never the adaptive icon." >&2
            exit 1
          fi
          echo "No adaptive icon loaded as a drawable."

      - name: Build release APK (pinned signature)
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.PINNED_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeryAccount-APK
          path: app/build/outputs/apk/release/app-release.apk
