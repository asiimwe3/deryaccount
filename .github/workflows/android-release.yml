name: Release APK

# Builds a SIGNED release APK and publishes it as a GitHub Release
# whenever a version tag (v*) is pushed. The release carries exactly the
# assets the in-app AutoUpdate expects:
#   deryaccount.apk  +  version.json
# (AutoUpdate reads releases/latest/download/version.json)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE secret is missing. Add the base64 keystore to the repo secrets, then re-run this workflow."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/deryaccount-signing.keystore"
          ls -la "$GITHUB_WORKSPACE/deryaccount-signing.keystore"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/deryaccount-signing.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare release assets
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" deryaccount.apk

          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          [ "$TAG" = "$GITHUB_REF_NAME" ] || TAG="$GITHUB_REF_NAME"
          NOTES=$(git tag -l --format='%(contents:subject)' "$TAG" 2>/dev/null | head -1)
          [ -z "$NOTES" ] && NOTES=$(git log -1 --pretty=%s | head -1)

          cat > version.json << JSON
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "notes": "$NOTES",
            "apkUrl": "https://github.com/asiimwe3/deryaccount/releases/latest/download/deryaccount.apk"
          }
          JSON
          cat version.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null | head -20)
          [ -z "$NOTES" ] && NOTES=$(git log -1 --pretty=%B | head -20)
          gh release create "$TAG" deryaccount.apk version.json \
            --title "DeryAccount $TAG" \
            --notes "$NOTES" \
            --latest
